<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":360}}'>
class Component extends DCLogic {
renderVals() {
var hex = '0123456789ABCDEF';
var seed = 7;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
var cols = [];
for (var i = 0; i < 34; i++) {
var n = 10 + Math.floor(rnd() * 18);
var s = [];
for (var j = 0; j < n; j++) s.push(hex[Math.floor(rnd() * 16)]);
cols.push({ t: s.join('\n') });
}
return { cols: cols };
}
}
</script>
